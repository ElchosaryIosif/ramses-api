spring:
  datasource:
    url: jdbc:h2:mem:ramses-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  session-secret: test-secret
  admin-password: ""
  cors:
    allowed-origins:
      - https://ramsesbazaar.com
